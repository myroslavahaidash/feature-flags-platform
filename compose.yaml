services:
  postgres:
    image: postgres:18
    container_name: feature-flags-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: feature_flags_user
      POSTGRES_PASSWORD: feature_flags_password
      POSTGRES_DB: feature_flags
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - feature_flags_postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: feature-flags-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  feature_flags_postgres_data:
